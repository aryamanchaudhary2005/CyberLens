[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberlens-api"
version = "0.1.0"
description = "CyberLens modular cyber threat analysis API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "certifi>=2026.10.19",
  "cryptography>=50.0.2,<51.0.0",
  "dnspython>=2.7,<3.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "publicsuffix2>=2.20191221",
  "pydantic-settings>=2.5,<3.0",
  "Pillow>=13.0.0,<14.0.0",
  "psycopg[binary]>=3.2,<4.0",
  "reportlab>=4.2,<5.0",
  "redis>=5.0,<7.0",
  "rq>=2.0,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
